<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saimom Car | Gestão Financeira</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#121821;--panel2:#1a2330;--line:#2a3645;--text:#eef4f9;--muted:#98a5b3;--gold:#c8a36a;--green:#1f9d62;--red:#dd5a54;--blue:#4b88ff;--orange:#f0ad4e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#090b0e,#111722);color:var(--text);min-height:100vh}
.container{max-width:1700px;margin:0 auto;padding:18px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.brand h1{font-size:clamp(18px,2.5vw,26px)}
.brand p{color:var(--muted);font-size:12px;margin-top:4px}
button,input,select,textarea{font:inherit}
button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;transition:opacity .15s}
button:hover{opacity:.85}
button.primary{background:var(--gold);color:#101010;font-weight:700;border-color:#d8b98b}
button.good{background:var(--green);border-color:#2db476}
button.warn{background:var(--orange);color:#151515}
button.danger{background:var(--red)}
button.small{padding:7px 10px;border-radius:10px;font-size:13px}
input,select,textarea{width:100%;background:#0f141b;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.grid{display:grid;gap:14px}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(185px,1fr));margin:12px 0}
.cards-2{grid-template-columns:1.2fr .8fr}
.cards-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:1100px){.cards-2,.cards-3{grid-template-columns:1fr}}
.card{background:rgba(18,24,33,.98);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 14px 32px rgba(0,0,0,.22)}
.kpi{min-height:100px;display:flex;flex-direction:column;justify-content:center}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .val{font-size:clamp(18px,1.8vw,28px);font-weight:800;margin-top:6px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}
.sec{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.sec h2{font-size:16px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:500px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:middle}
th{position:sticky;top:0;background:#131a23f2;backdrop-filter:blur(4px);z-index:1}
tbody tr:hover{background:#111821}
.r{text-align:right}.c{text-align:center}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:11px;border:1px solid var(--line);color:var(--muted);background:#0f141b}
.badge.receita{background:rgba(31,157,98,.15);color:#86e3b5}
.badge.despesa{background:rgba(221,90,84,.15);color:#ffb3af}
.badge.transferencia{background:rgba(75,136,255,.15);color:#c4d9ff}
.badge.pago,.badge.recebido{background:rgba(31,157,98,.16);color:#86e3b5}
.badge.atrasado{background:rgba(221,90,84,.18);color:#ffb3af}
.badge.aberto{background:rgba(240,173,78,.16);color:#ffd08d}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:11px;border:1px solid var(--line);color:var(--muted);background:#0f141b}
.list{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line);align-items:center}
.muted{color:var(--muted)}.pos{color:#86e3b5}.neg{color:#ffb3af}
.report{white-space:pre-wrap;line-height:1.6;background:#0e141b;border:1px dashed #344255;border-radius:14px;padding:14px;font-size:13px}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabbar button.active{background:var(--gold);color:#111;border-color:#e0c69a;font-weight:700}
.tab{display:none}.tab.active{display:block}
.mw{position:relative}
.mp{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:rgba(18,24,33,.99);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 18px 36px rgba(0,0,0,.28);z-index:20}
.mp.open{display:grid;gap:8px}
.mp button{width:100%;text-align:left}
.fp{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:290px;background:rgba(18,24,33,.99);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 18px 36px rgba(0,0,0,.28);z-index:20}
.fp.open{display:block}
.fp .f{margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(4,8,14,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal.open{display:flex}
.mc{width:min(700px,100%);max-height:85vh;overflow:auto;background:rgba(18,24,33,.99);border:1px solid var(--line);border-radius:18px;padding:18px}
.auth-wrap{max-width:460px;margin:40px auto}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.ch{font-size:11px;text-transform:uppercase;color:var(--muted);padding:0 4px 4px}
.cc{min-height:105px;background:linear-gradient(180deg,#101722,#0d131b);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.cc:hover{transform:translateY(-1px);border-color:#465971}
.cc.md{opacity:.3}.cc.pd{border-color:rgba(221,90,84,.4)}.cc.rd{border-color:rgba(31,157,98,.4)}.cc.xd{border-color:rgba(75,136,255,.4)}.cc.td{box-shadow:0 0 0 1px rgba(200,163,106,.5)}
.cd{font-weight:700;font-size:13px}
.cb{border:none;border-radius:10px;padding:7px 9px;text-align:left;font-size:12px;font-weight:700;cursor:pointer;width:100%}
.cb.pay{background:rgba(221,90,84,.14);color:#ffc4bf}.cb.rec{background:rgba(31,157,98,.14);color:#9ce8c2}.cb.mix{background:rgba(75,136,255,.14);color:#c4d9ff}
.ab{border:1px solid var(--line);border-left:4px solid var(--orange);background:#111821;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sn{font-size:12px;color:var(--muted);margin-top:8px}
.wh{background:rgba(200,163,106,.10)}
.status-bar{background:#0f141b;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
@media(max-width:900px){.cg{grid-template-columns:repeat(2,1fr)}.ch{display:none}.cc{min-height:80px}.fp{min-width:260px;left:0;right:auto}}
</style>
</head>
<body>
<div class="container">

<!-- STATUS BAR -->
<div class="status-bar">
  <span>🚗 <strong>Saimom Car</strong> | Gestão Financeira</span>
  <span class="pill" id="authPill">não autenticado</span>
  <span class="muted" id="syncMsg" style="font-size:12px">faça login para sincronizar com a nuvem</span>
  <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
    <button class="small" onclick="syncNow()" id="btnSync" style="display:none">☁️ Sincronizar</button>
    <button class="small danger" onclick="doSignOut()" id="btnLogout" style="display:none">Sair</button>
    <button class="small primary" onclick="openAuthModal()" id="btnLogin">Entrar / Cadastrar</button>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">
    <h1>Saimom Car • Gestão Financeira V2</h1>
    <p>Lançamentos • Contas a pagar e receber • Alertas • Fechamento mensal • Sincronizado na nuvem</p>
  </div>
  <div class="acts">
    <input type="file" id="importLaunchFile" accept=".xlsx,.xls,.csv" style="display:none">
    <input type="file" id="importBackupFile" accept=".json" style="display:none">
    <div class="mw">
      <button class="primary" onclick="toggleMenu('mainMenu',event)">Arquivo e backup ▾</button>
      <div id="mainMenu" class="mp">
        <button onclick="document.getElementById('importLaunchFile').click();closeMenu('mainMenu')">📥 Importar planilha Excel</button>
        <button onclick="exportWorkbook();closeMenu('mainMenu')">📤 Exportar sistema Excel</button>
        <button onclick="exportBackup();closeMenu('mainMenu')">💾 Backup JSON</button>
        <button onclick="document.getElementById('importBackupFile').click();closeMenu('mainMenu')">🔄 Restaurar backup JSON</button>
        <button class="warn" onclick="resetBase();closeMenu('mainMenu')">⚠️ Voltar base inicial</button>
      </div>
    </div>
  </div>
</div>

<!-- KPIs -->
<div class="grid kpi-grid" id="kpiGrid"></div>

<!-- TABS -->
<div class="tabbar">
  <button class="active" data-tab="tab-dia" onclick="setTab('tab-dia',this)">Hoje</button>
  <button data-tab="tab-lancamentos" onclick="setTab('tab-lancamentos',this)">Lançamentos</button>
  <button data-tab="tab-movimentos" onclick="setTab('tab-movimentos',this)">Receitas x Despesas</button>
  <button data-tab="tab-pagar" onclick="setTab('tab-pagar',this)">Contas a Pagar</button>
  <button data-tab="tab-receber" onclick="setTab('tab-receber',this)">Contas a Receber</button>
  <button data-tab="tab-alertas" onclick="setTab('tab-alertas',this)">Alertas</button>
  <button data-tab="tab-fechamento" onclick="setTab('tab-fechamento',this)">Fechamento</button>
</div>

<!-- TAB HOJE -->
<section id="tab-dia" class="tab active">
  <div class="grid cards-2" style="margin-bottom:14px">
    <div class="card">
      <div class="sec"><h2>Lançamentos de hoje</h2><span class="pill" id="todayCount">0</span></div>
      <div id="todaySummary" class="report"></div>
    </div>
    <div class="card">
      <div class="sec"><h2>Ações rápidas</h2><button class="small primary" onclick="todayLaunch();setTab('tab-lancamentos',document.querySelector('[data-tab=tab-lancamentos]'))">+ Novo lançamento hoje</button></div>
      <div id="todayHighlights" class="list"></div>
    </div>
  </div>
